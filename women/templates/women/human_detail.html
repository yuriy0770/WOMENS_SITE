{% extends 'women/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            {% if human.image %}
            <img src="{{ human.image.url }}" alt="{{ human.name_h }}"
                 class="img-fluid rounded shadow" style="width: 100%; height: 400px; object-fit: cover;">
            {% endif %}
        </div>
        <div class="col-md-8">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'women:index' %}">Главная</a></li>
                    <li class="breadcrumb-item"><a href="{{ human.cat.get_absolute_url }}">{{ human.cat.name }}</a></li>
                    <li class="breadcrumb-item active">{{ human.name_h }}</li>
                </ol>
            </nav>

            <h1 class="fw-bold display-4 mb-3">{{ human.name_h }}</h1>
            <div class="badge bg-primary mb-3">{{ human.cat.name }}</div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">О себе</h5>
                    <p class="card-text lead">{{ human.descriptions|linebreaks }}</p>
                </div>
            </div>

            <div class="mt-4">
                <small class="text-muted">Добавлено: {{ human.created_at|date:"d.m.Y" }}</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
